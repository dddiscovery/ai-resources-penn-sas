---
layout: default
---

<div class="hero">
  <div class="hero-content">
    {% comment %}<div class="hero-eyebrow">{{ page.hero.eyebrow }}</div>{% endcomment %}
    <h1>{{ page.hero.heading }}</h1>
    <p class="hero-sub">{{ page.hero.subtext }}</p>
    <div class="btn-row">
      {% for btn in page.hero.buttons %}
      <a href="{{ btn.url | relative_url }}" class="{{ btn.style }}">{{ btn.label }}</a>
      {% endfor %}
    </div>
  </div>
  <div class="hero-asterisk">✦</div>
</div>


<div class="about-strip">
  <div class="about-inner">
    <h4>About this resource</h4>
    <p>{{ page.about.text }}</p>
  </div>
</div>
