title: AI Resources for Penn Arts & Sciences
description: "A curated guide to AI and LLM tools for Penn Arts & Sciences researchers: what's available, what it genuinely does well, and where the risks lie."
url: "https://ai-resources.datascience.sas.upenn.edu"
# Production is served at the root of the custom domain, so baseurl is empty.
# _config_dev.yml also sets it to "" for local serving.
baseurl: ""

# External links used in the site chrome
links:
  dddi: "https://datascience.sas.upenn.edu/"
  penn_sas: "https://www.sas.upenn.edu/"
  upenn: "https://www.upenn.edu"


markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - package.json
  - package-lock.json
